# Purpose: Build and draft a GitHub release with categorized release notes

name: Build Draft Release

on:
  workflow_dispatch:
    inputs:
      # checkov:skip=CKV_GHA_7:Manual inputs are desired.
      releaseName:
        description: "Release Name (e.g., 1.0.0)"
        required: true
        type: string
      # Note: This should match __version__ in scubagoggles/__init__.py.
      version:
        description: "Release Version (e.g., 1.0.0)"
        required: true
        type: string
      compareHeadRef:
        description: "Compare head ref (branch, tag, or SHA) for release notes, e.g. main or release/1.0.0. Defaults to the commit SHA of the workflow run."
        required: false
        type: string
        default: ""

permissions: read-all

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: tcort/github-action-markdown-link-check@v1
      with:
        base-branch: 'main'
        config-file: 'mlc_config.json'
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'

  build-and-deploy:
    needs: markdown-link-check
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NAME: ${{ inputs.releaseName }}
      COMPARE_HEAD_REF: ${{ inputs.compareHeadRef }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Package Repo for release
        shell: bash
        run: ./utils/workflow/package_release.sh

      - name: Get previous release tag
        id: previous-release
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: return require('./utils/workflow/get_previous_release.js')({ github, context, core });

      - name: Generate release notes
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          COMPARE_HEAD_REF: ${{ inputs.compareHeadRef }}
          PREVIOUS_RELEASE_TAG: ${{ steps.previous-release.outputs.tag }}
        with:
          script: return require('./utils/workflow/generate_release_notes.js')({ github, context, core });

      - name: Show release notes
        run: ./utils/workflow/show_release_notes.sh

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        id: create_release
        with:
          draft: true
          prerelease: false
          name: v${{ inputs.releaseName }}
          tag_name: v${{ inputs.version }}
          body_path: release-body.md
          files: |
            scubagoggles-*-py3-none-any.whl
            scubagoggles-*.tar.gz
            scubagoggles-*.zip
          fail_on_unmatched_files: true
